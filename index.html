<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WAR — The Card Game</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <canvas id="fx" aria-hidden="true"></canvas>

  <div class="vignette" aria-hidden="true"></div>

  <header class="topbar">
    <h1 class="title">
      <span class="title-letter">W</span><span class="title-letter">A</span><span class="title-letter">R</span>
    </h1>
    <div class="subtitle">Classic Card Duel — You vs. The Machine</div>
  </header>

  <main class="table">

    <!-- AI area -->
    <section class="player-area ai-area">
      <div class="player-info">
        <div class="avatar ai-avatar">
          <div class="eye left"></div>
          <div class="eye right"></div>
          <div class="mouth"></div>
        </div>
        <div class="player-meta">
          <div class="player-name">A.I. OPPONENT</div>
          <div class="player-stats">
            <span class="deck-count" id="aiCount">26</span>
            <span class="stat-label">cards</span>
          </div>
        </div>
      </div>
      <div class="deck-stack" id="aiDeck" aria-label="AI deck">
        <!-- deck stack cards injected -->
      </div>
    </section>

    <!-- Battle zone -->
    <section class="battlefield" id="battlefield">
      <div class="war-banner" id="warBanner">WAR!</div>

      <div class="battle-row">
        <div class="slot ai-slot" id="aiSlot">
          <div class="slot-label">AI plays</div>
        </div>

        <div class="versus">
          <div class="vs-ring"></div>
          <div class="vs-text">VS</div>
        </div>

        <div class="slot player-slot" id="playerSlot">
          <div class="slot-label">You play</div>
        </div>
      </div>

      <div class="war-pile-label" id="pileLabel"></div>

      <div class="messages" id="messages">Click <b>FLIP</b> to begin.</div>
    </section>

    <!-- Player area -->
    <section class="player-area you-area">
      <div class="deck-stack" id="playerDeck" aria-label="Your deck">
        <!-- deck stack cards injected -->
      </div>
      <div class="player-info">
        <div class="avatar you-avatar">
          <div class="crown"></div>
        </div>
        <div class="player-meta">
          <div class="player-name">YOU</div>
          <div class="player-stats">
            <span class="deck-count" id="playerCount">26</span>
            <span class="stat-label">cards</span>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="controls">
    <button id="flipBtn" class="btn btn-primary">
      <span class="btn-glow"></span>
      <span class="btn-label">FLIP</span>
    </button>
    <button id="autoBtn" class="btn btn-ghost">AUTO ▷</button>
    <button id="newBtn" class="btn btn-ghost">NEW GAME</button>
    <button id="fsBtn" class="btn btn-ghost" title="Toggle fullscreen">⛶ FULLSCREEN</button>
    <label class="speed">
      Speed
      <input type="range" id="speed" min="300" max="1400" step="100" value="800" />
    </label>
    <div class="round-indicator">Round <span id="roundNum">0</span></div>
  </footer>

  <!-- Game over modal -->
  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal">
      <div class="modal-title" id="modalTitle">VICTORY</div>
      <div class="modal-sub" id="modalSub">You conquered the deck.</div>
      <div class="trophy" aria-hidden="true">
        <div class="trophy-cup"></div>
        <div class="trophy-base"></div>
      </div>
      <button class="btn btn-primary" id="modalBtn">
        <span class="btn-glow"></span>
        <span class="btn-label">PLAY AGAIN</span>
      </button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
